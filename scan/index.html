<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>150 Worth Scan Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --paper:#fff; --mute:#8a8a8a; --line:#d9d9d9; --panel:rgba(255,255,255,.94); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--ink); color:var(--ink); font:14px/1.4 Inter, system-ui, sans-serif; }
  header { position:fixed; inset:0 0 auto 0; height:52px; z-index:10; display:flex; align-items:center; gap:16px;
           padding:0 16px; background:var(--paper); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font:600 20px/1 "Cormorant Garamond", Georgia, serif; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  header .where { color:var(--mute); font-size:12px; letter-spacing:.08em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sp { flex:1; }
  header .back { color:var(--ink); text-decoration:none; font-size:28px; line-height:1; padding:0 4px 4px 0; }
  button { font:500 12px/1 Inter, sans-serif; letter-spacing:.08em; text-transform:uppercase; background:var(--paper); color:var(--ink);
           border:1px solid var(--ink); padding:9px 12px; cursor:pointer; }
  button:hover, button.on { background:var(--ink); color:var(--paper); }
  #pano { position:fixed; inset:96px 0 0 0; }
  #plan { position:fixed; right:16px; bottom:16px; z-index:10; width:380px; background:var(--panel); border:1px solid var(--ink); }
  #plan .cap { display:flex; justify-content:space-between; padding:8px 10px; border-bottom:1px solid var(--line);
               font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  #plan svg { display:block; width:100%; height:auto; max-height:46vh; }
  /* floor bar: always visible under the header */
  #floors { position:fixed; top:52px; left:0; right:0; z-index:10; display:flex; background:var(--paper); border-bottom:1px solid var(--ink); }
  #floors button { flex:1; border:0; border-right:1px solid var(--line); padding:9px 14px; text-align:left; line-height:1.3; }
  #floors button:last-child { border-right:0; }
  #floors button small { display:block; font-size:10px; letter-spacing:.06em; opacity:.65; }
  #floors button:disabled { color:var(--mute); background:var(--paper); cursor:default; }
  #plan.hidden { display:none; }
  .dot { fill:var(--paper); stroke:var(--ink); stroke-width:1.2; vector-effect:non-scaling-stroke; cursor:pointer; }
  .dot:hover { fill:var(--ink); }
  .dot.cur { fill:var(--ink); }
  .cone { fill:rgba(17,17,17,.22); stroke:none; pointer-events:none; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:20; background:var(--ink); color:var(--paper);
           padding:10px 14px; font-size:12px; letter-spacing:.06em; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  /* walk arrows */
  .walk { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.85); border:2px solid var(--ink); cursor:pointer; }
  .walk::after { content:""; position:absolute; left:50%; top:50%; width:10px; height:10px; margin:-3px 0 0 -5px;
                 border-left:2px solid var(--ink); border-top:2px solid var(--ink); transform:rotate(45deg); }
  .walk:hover { background:var(--paper); }
  .walk span { visibility:hidden; position:absolute; bottom:42px; left:50%; transform:translateX(-50%); white-space:nowrap;
               background:var(--ink); color:var(--paper); padding:5px 8px; font-size:11px; letter-spacing:.06em; }
  .walk:hover span { visibility:visible; }
  /* render options: shown only on spots that have renders */
  #looks { position:fixed; left:16px; bottom:16px; z-index:10; display:flex; gap:8px; }
  #looks[hidden] { display:none; }
  #looks { align-items:flex-end; }
  #looks button.small { padding:6px 9px; font-size:10px; letter-spacing:.08em; opacity:.85; }
  #looks button { padding:13px 18px; font-size:13px; letter-spacing:.12em; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  /* title page */
  #intro { position:fixed; inset:0; z-index:50; background:var(--paper); display:flex; align-items:center; justify-content:center;
           padding:24px 16px; overflow:auto; transition:opacity .45s ease; }
  #intro.out { opacity:0; pointer-events:none; }
  #intro .in { display:flex; flex-direction:column; align-items:center; text-align:center; max-width:640px; width:100%; }
  #intro .logo { width:min(300px, 64vw); height:auto; display:block; }
  #intro .rule { width:56px; height:1px; background:var(--ink); margin:28px 0 22px; }
  #intro .title { margin:0 0 36px; font:500 clamp(30px, 6vw, 46px)/1 "Cormorant Garamond", Georgia, serif;
                  letter-spacing:.32em; text-transform:uppercase; padding-left:.32em; }
  #intro .place { font:500 14px/1 Inter, sans-serif; letter-spacing:.22em; padding:18px 30px; max-width:100%; white-space:nowrap; }
  #intro .place[aria-expanded="true"] { background:var(--ink); color:var(--paper); cursor:default; }
  #intro .choose { margin-top:28px; display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  #intro .choose[hidden] { display:none; }
  #intro .choose button { min-width:150px; padding:15px 20px; font-size:13px; letter-spacing:.14em; }
  #intro .hint { margin:22px 0 0; color:var(--mute); font-size:11px; letter-spacing:.14em; text-transform:uppercase; }
  .pnlm-container { background:var(--ink); }
  .pnlm-orientation-button { display:none !important; }   /* replaced by the Motion button in the header */
  #tools { display:flex; gap:8px; }
  button { touch-action:manipulation; }
  /* ---------- the one menu (☰): search on top, then sections that open and close ----------
     laptop: a panel on the right under the header. phone: a sheet from the bottom, swipe it down to close. */
  #btnMenu { padding:6px 11px; font-size:18px; letter-spacing:0; }
  #menu { position:fixed; z-index:30; top:52px; right:0; width:min(360px, 100vw); max-height:calc(100dvh - 52px);
          display:flex; flex-direction:column; background:var(--paper); border-left:1px solid var(--ink); border-bottom:1px solid var(--ink);
          box-shadow:-6px 8px 24px rgba(0,0,0,.25); transform:translateX(102%); visibility:hidden;
          transition:transform .24s ease, visibility .24s; }
  #menu.open { transform:none; visibility:visible; }
  #menu.drag { transition:none; }
  #menu .grab { display:none; }
  #menu .mhead { flex:none; padding:12px; border-bottom:1px solid var(--line); }
  #msearch { width:100%; font:400 16px/1.3 Inter, sans-serif; padding:11px 12px; border:1px solid var(--ink); border-radius:0;
             background:var(--paper); color:var(--ink); -webkit-appearance:none; appearance:none; outline:none; }
  #msearch:focus { box-shadow:0 0 0 2px var(--ink); }
  #mbody, #mresults { overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #mbody { padding:0 12px 12px; }
  #mresults { padding:10px 12px 14px; display:flex; flex-direction:column; gap:6px; }
  #mbody[hidden], #mresults[hidden] { display:none; }
  #menu details { border-bottom:1px solid var(--line); }
  #menu summary { list-style:none; display:flex; align-items:center; gap:10px; padding:15px 2px; cursor:pointer;
                  font:500 12px/1 Inter, sans-serif; letter-spacing:.14em; text-transform:uppercase; user-select:none; }
  #menu summary::-webkit-details-marker { display:none; }
  #menu summary small { margin-left:auto; color:var(--mute); font-size:11px; letter-spacing:.04em; text-transform:none;
                        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60%; }
  #menu summary::after { content:"+"; flex:none; width:14px; text-align:center; font-size:18px; font-weight:400; letter-spacing:0; }
  #menu details[open] summary::after { content:"\2212"; }
  #menu .mpanel { display:flex; flex-direction:column; gap:6px; padding:0 0 14px; }
  #menu .mpanel button, #mresults button { text-align:left; padding:11px 12px; line-height:1.3; text-transform:none; letter-spacing:.02em; font-size:13px; }
  #menu .mpanel button small, #mresults button small { display:block; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.6; margin-top:3px; }
  #menu .mnote { margin:2px 0 4px; color:var(--mute); font-size:12px; }
  #menu .mlab { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--mute); margin:8px 0 2px; }
  #menu #floors { position:static; display:flex; flex-direction:column; border:1px solid var(--line); }
  #menu #floors button { border:0; border-bottom:1px solid var(--line); padding:11px 12px; font-size:12px; }
  #menu #floors button:last-child { border-bottom:0; }
  #menu #tools { flex-direction:column; gap:6px; }
  #menu #tools button[hidden] { display:none; }
  #menu .seg { display:flex; }
  #menu .seg button { flex:1; padding:9px 4px; font-size:11px; text-align:center; }
  #menu .seg button + button { border-left:0; }
  /* on a laptop the floor bar stays under the header, so the menu does not repeat it */
  @media (min-width:761px) { #menu details[data-k="floor"] { display:none; } }
  /* control size (menu): scales the overlays, not the picture */
  body { --ui:1; }
  body[data-ui="s"] { --ui:.82; }
  body[data-ui="l"] { --ui:1.2; }
  #looks, #plan, #menu, #btnShow { zoom:var(--ui); }
  /* hide all controls: just the picture, with one small button to bring them back */
  body.bare header, body.bare #floors, body.bare #plan, body.bare #looks, body.bare #menu,
  body.bare .pnlm-controls-container { display:none !important; }
  body.bare #pano { inset:0; }
  #btnShow { position:fixed; top:calc(8px + env(safe-area-inset-top)); right:calc(8px + env(safe-area-inset-right)); z-index:40;
             padding:7px 10px; font-size:10px; opacity:.85; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  #btnShow[hidden] { display:none; }
  /* in the pop-up on the plan page (link ends in &skip=1): just the picture, walk arrows and render buttons */
  body.embed header, body.embed #floors, body.embed #plan, body.embed #menu, body.embed #btnShow { display:none !important; }
  body.embed #pano { inset:0 !important; }

  /* ---------- phone ---------- */
  @media (max-width:760px) {
    header { height:calc(44px + env(safe-area-inset-top)); padding:env(safe-area-inset-top) 10px 0; gap:8px; }
    header h1 { font-size:15px; letter-spacing:.04em; }
    header .where { display:none; }
    header .back { font-size:26px; }
    #pano { inset:calc(44px + env(safe-area-inset-top)) 0 0 0; }
    /* the menu becomes a sheet from the bottom with a grab bar; swipe it down to close */
    #menu { top:auto; bottom:0; left:0; right:0; width:100%; max-height:min(82dvh, 680px); border:0; border-top:1px solid var(--ink);
            box-shadow:0 -10px 30px rgba(0,0,0,.3); transform:translateY(102%); padding-bottom:env(safe-area-inset-bottom); }
    #menu .grab { display:block; flex:none; width:44px; height:5px; border-radius:3px; background:var(--line); margin:9px auto 0; }
    #menu .mhead { padding-top:10px; }
    /* small corner map, starts hidden */
    #plan { left:auto; right:8px; bottom:auto; top:calc(52px + env(safe-area-inset-top)); width:44vw; max-width:220px; }
    #plan svg { max-height:32vh; }
    /* render options: one slim row along the bottom, scrolls sideways if it does not fit */
    #looks { left:8px; right:8px; top:auto; bottom:calc(10px + env(safe-area-inset-bottom)); gap:6px;
             overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    #looks::-webkit-scrollbar { display:none; }
    #looks button { flex:0 0 auto; padding:8px 11px; font-size:11px; letter-spacing:.08em; white-space:nowrap; }
    #looks button.small { padding:6px 8px; font-size:9.5px; }
    /* pinch zooms on a phone, so the +/- and fullscreen buttons only take space */
    .pnlm-controls-container { display:none; }
    .walk { width:30px; height:30px; }
    #intro .place { font-size:12px; letter-spacing:.14em; padding:16px 18px; }
    #intro .choose button { min-width:0; flex:1 1 40%; padding:14px 6px; font-size:12px; letter-spacing:.08em; white-space:nowrap; }
  }
</style>
</head>
<body>
<script>if (/[#&]skip=1/.test(location.hash)) document.body.classList.add("embed");   // skip=1: pop-up box, picture only. skip=2: no title page, full viewer</script>
<header>
  <a href="../" class="back" title="Back to Burlington Arcade">&#8249;</a>
  <h1>150 Worth Avenue</h1>
  <div class="where" id="where"></div>
  <div class="sp"></div>
  <div id="tools">
    <button id="btnMotion" type="button" hidden>Motion</button>
    <button id="btnAngle" type="button" title="Frame a still view: wide lenses, straight verticals, capture">Angle finder</button>
    <button id="btnPlan" class="on" type="button">Plan</button>
    <button id="btnLink" type="button">Copy link</button>
  </div>
  <button id="btnMenu" type="button" aria-expanded="false" aria-controls="menu" title="Menu">&#9776;</button>
</header>
<!-- the one menu: search, then Floor / Version / Places / Tools, one section open at a time -->
<div id="menu" role="dialog" aria-label="Menu" aria-hidden="true">
  <div class="grab" aria-hidden="true"></div>
  <div class="mhead"><input id="msearch" type="search" placeholder="Search: entrance, Level 2, designed" autocomplete="off" enterkeyhint="go" aria-label="Search the 360"></div>
  <div id="mresults" hidden></div>
  <div id="mbody">
    <details data-k="floor"><summary>Floor <small id="sumFloor"></small></summary><div class="mpanel" id="menuFloors"></div></details>
    <details data-k="look"><summary>Version <small id="sumLook"></small></summary><div class="mpanel" id="menuLooks"></div></details>
    <details data-k="places"><summary>Places <small id="sumPlace"></small></summary><div class="mpanel" id="menuPlaces"></div></details>
    <details data-k="tools"><summary>Tools</summary><div class="mpanel">
      <div id="menuTools"></div>
      <div class="mlab">Control size</div>
      <div class="seg" id="uiSize"><button type="button" data-s="s">Small</button><button type="button" data-s="m">Medium</button><button type="button" data-s="l">Large</button></div>
      <button id="btnHide" type="button">Hide all controls</button>
    </div></details>
  </div>
</div>
<button id="btnShow" type="button" hidden>Show controls</button>
<div id="pano"></div>
<nav id="floors" aria-label="Floors"></nav>
<div id="plan"><svg id="map"></svg></div>
<div id="looks" hidden></div>
<div id="toast"></div>
<div id="intro">
  <div class="in">
    <img class="logo" src="fs-logo.png" alt="Fairfax &amp; Sammons">
    <div class="rule"></div>
    <h2 class="title">360 Viewer</h2>
    <button id="introPlace" class="place" type="button" aria-expanded="false">150 Worth Ave ~ Palm Beach</button>
    <div id="introChoose" class="choose" hidden></div>
    <p id="introHint" class="hint" hidden>Choose a view</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script src="data.js"></script>
<script src="angle-finder.js"></script>
<script>
// Scanner image geometry (from the .rcc header): 360° across, +89.8° down to -60.0° vertically.
// bump this number whenever a picture in panos/ is replaced, so browsers drop their old copy
const IMG_V = "2";
const VAOV = 149.86, VOFFSET = 14.88;
// Calibration between panorama yaw and the ReCap world frame.
const YAW_OFFSET = 0, YAW_SIGN = -1;
const EYE = 1.5;          // approx. scanner height above floor, metres
const LINK_RADIUS = 9;    // metres
const LINK_MAX = 6;

// Floors, top to bottom. A floor with no scans yet shows as Pending.
const FLOORS = [
  { key: "F1",  name: "Level 1 + Exterior" },
  { key: "B",   name: "Basement" },
  { key: "F2",  name: "Level 2" }
];
// where a floor tab opens: the main gallery, not a side room
const FLOOR_START = { F1: "Galerry_1_st_Scan_164", F2: "F2-040", B: "Basement_parking_Scan_307" };
// Rendered versions of a spot, drawn over the same 360 view. Add a spot here to give it buttons.
// Each image goes in panos/ and must have the same proportions as the scan (about 2.42 : 1).
// The scan itself always shows as BEFORE_LABEL.
const BEFORE_LABEL = "Before";
const LOOKS = {
  // key "" is the raw scan: listing it here replaces the automatic Before button (small = shown as a small button)
  "Fasad__Scan_464": [
    { key: "before",    label: "Before",            file: "Fasad__Scan_464-before.jpg" },
    { key: "nocars",    label: "Before, no cars",   file: "Fasad__Scan_464-nocars.jpg" },
    { key: "renovated", label: "Renovated",         file: "Fasad__Scan_464-renovated.jpg" },
    { key: "designed",  label: "Designed",          file: "Fasad__Scan_464-designed.jpg" },
    { key: "",          label: "Unenhanced before", small: true }
  ],
  "F2-040": [
    { key: "render", label: "Render me", file: "F2-040-render.jpg" },
    { key: "decor",  label: "Designed",  file: "F2-040-decor.jpg" }
  ]
};
// Named spots for the menu's Places list and its search (same names as 360 on the Plan and 360 on the Elevation).
// look = which version opens; y / p / f = the way it first looks. To add one: { id:"<spot from data.js>", name:"Words shown" }
const PLACES = [
  { id: "Fasad__Scan_464", look: "renovated", y: 99.1, p: 8.4, f: 100, name: "Across Worth Avenue", k: "exterior street facade outside" },
  { id: "Fasad__Scan_471", y: 90.1, name: "Worth Avenue, far right", k: "exterior street facade" },
  { id: "Fasad__Scan_465", y: 90.1, name: "Worth Avenue, where the arches start", k: "exterior street facade arches" },
  { id: "Fasad__Scan_458", y: 89.7, name: "Worth Avenue, where the arches stop", k: "exterior street facade arches" },
  { id: "Fasad__Scan_452", y: 89.8, name: "The 150 Worth entrance", k: "exterior street door front" },
  { id: "Fasad__Scan_448", y: 87.7, name: "The five bays", k: "exterior street facade" },
  { id: "Fasad__Scan_443", y: 88.5, name: "The garages", k: "exterior street garage parking" },
  { id: "Galerry_1_st_Scan_188", name: "Arcade entrance from Worth Avenue", k: "gallery door front" },
  { id: "Galerry_1_st_Scan_193", name: "Arcade gallery, central", k: "gallery via" },
  { id: "Galerry_1_st_Scan_207", name: "Arcade gallery, east bend", k: "gallery via" },
  { id: "Galerry_1_st_Scan_229", name: "West court", k: "courtyard" },
  { id: "Saks_dors_1_st_Scan_553", name: "Former Saks space", k: "store shop" },
  { id: "Galerry_2_nd_Scan_133", name: "Level 2, west gallery", k: "upstairs second" },
  { id: "Galerry_2_nd_Scan_121", name: "Level 2, central gallery", k: "upstairs second" },
  { id: "Galerry_2_nd_Scan_108", name: "Level 2, east bend", k: "upstairs second" },
  { id: "F2-071", name: "Level 2, east suite", k: "upstairs second office" }
];
const START = "Fasad__Scan_464";   // the spot the viewer opens on when there is no share link (exterior, Worth Avenue)
const SEP = "__";            // scene id for a look: "F2-040__render"
// Only a known look counts as a suffix (scan names like "Fasad__Scan_438" contain "__" too).
function splitId(id) {
  id = String(id);
  const i = id.lastIndexOf(SEP);
  if (i > 0) {
    const b = id.slice(0, i), k = id.slice(i + SEP.length);
    if ((LOOKS[b] || []).some(l => l.key === k)) return [b, k];
  }
  return [id, ""];
}
const baseOf = id => splitId(id)[0];
const lookOf = id => splitId(id)[1];

const S = window.STATIONS;
const byId = Object.fromEntries(S.map(s => [s.id, s]));
const onFloor = key => S.filter(s => s.floor === key);
const startOf = key => byId[FLOOR_START[key]] ? FLOOR_START[key] : onFloor(key)[0].id;
const floorName = key => (FLOORS.find(f => f.key === key) || {}).name || key;
const norm = a => ((a % 360) + 540) % 360 - 180;
const deg = r => r * 180 / Math.PI;

// panorama yaw that looks from station a toward world bearing b (deg, CCW from +x)
const yawFor = (a, bearing) => norm(YAW_SIGN * (bearing - a.rz) + YAW_OFFSET);
const bearingFor = (a, yaw) => norm(a.rz + YAW_SIGN * (yaw - YAW_OFFSET));

function neighbours(a) {
  // exterior and interior spots only link where they are close (doorways), never through walls
  return S.filter(b => b !== a && b.floor === a.floor && (!!b.ext === !!a.ext || Math.hypot(b.x - a.x, b.y - a.y) < 3.5))
    .map(b => ({ b, d: Math.hypot(b.x - a.x, b.y - a.y) }))
    .sort((p, q) => p.d - q.d)
    .filter((p, i) => i < 2 || p.d <= LINK_RADIUS)
    .slice(0, LINK_MAX);
}

function walkTooltip(div, args) {
  div.classList.add("walk");
  const s = document.createElement("span");
  s.textContent = args.label;
  div.appendChild(s);
}

// Field of view: natural default, capped so it never goes fish-eye or past the photo's sharpness.
const HFOV = 80, MIN_HFOV = 45, MAX_HFOV = 100;
const DBL_CLICK_CONE = 45;   // double-click walks to the nearest spot within this many degrees

const links = {};            // scene id -> [{ id, yaw, pitch, d }]
const scenes = {};
for (const a of S) {
  links[a.id] = neighbours(a).map(({ b, d }) => ({
    id: b.id, d,
    yaw: yawFor(a, deg(Math.atan2(b.y - a.y, b.x - a.x))),
    pitch: -deg(Math.atan2(EYE, d))
  }));
  scenes[a.id] = {
    type: "equirectangular", panorama: `panos/${a.id}.jpg?v=${IMG_V}`,
    // December scans keep the scanner's 150-degree strip; v3 scans ("full") are padded to a full sphere
    haov: 360, vaov: a.full ? 180 : VAOV, vOffset: a.full ? 0 : VOFFSET, hfov: HFOV, minHfov: MIN_HFOV, maxHfov: MAX_HFOV,
    // pannellum keeps (yaw + northOffset) constant when walking, so this keeps the world heading
    northOffset: norm(YAW_SIGN * a.rz - YAW_OFFSET),
    hotSpots: links[a.id].map(l => ({
      type: "info", yaw: l.yaw, pitch: l.pitch,
      createTooltipFunc: walkTooltip,
      createTooltipArgs: { label: `${l.id} · ${l.d.toFixed(1)} m` },
      clickHandlerFunc: () => walkTo(l)
    }))
  };
  // same view and walk arrows, different picture
  for (const lk of (LOOKS[a.id] || []).filter(l => l.file)) {
    scenes[a.id + SEP + lk.key] = { ...scenes[a.id], panorama: `panos/${lk.file}?v=${IMG_V}` };
  }
}

// start from the share link if there is one
const h = new URLSearchParams(location.hash.slice(1));
// #s=<spot> opens a spot; #floor=<key> opens the first spot on that floor
const first = scenes[h.get("s")] ? h.get("s")
  : (onFloor(h.get("floor") || "").length ? startOf(h.get("floor"))
  : (byId[START] ? (scenes[START + SEP + "before"] ? START + SEP + "before" : START) : onFloor("F2")[0].id));
// the view people land on at the start spot (looking down Worth Avenue at the arcade)
const START_VIEW = { yaw: 90.6, pitch: 2.2, hfov: 100 };
if (h.has("y")) Object.assign(scenes[first], { yaw: +h.get("y"), pitch: +h.get("p") || 0, hfov: +h.get("f") || HFOV });
else if (baseOf(first) === START) for (const id of Object.keys(scenes)) if (baseOf(id) === START) Object.assign(scenes[id], START_VIEW);

const viewer = pannellum.viewer("pano", {
  default: { firstScene: first, sceneFadeDuration: 450, autoLoad: true, showControls: true, compass: false,
             friction: 0.12, orientationOnByDefault: false },
  scenes
});

// Walk: turn to face the spot, push in a little like stepping forward, then fade into the next panorama.
let walking = false;
function walkTo(l) {
  if (walking) return;
  walking = true;
  const pitch = Math.max(viewer.getPitch(), -10);
  viewer.lookAt(pitch, l.yaw, Math.max(MIN_HFOV, viewer.getHfov() * 0.7), 380, () => {
    viewer.loadScene(l.id, pitch, "sameAzimuth", HFOV);
  });
}
viewer.on("scenechange", () => { walking = false; });

// Double-click anywhere: walk to the nearest linked spot in that direction.
viewer.getContainer().addEventListener("dblclick", e => {
  const [, yaw] = viewer.mouseEventToCoords(e);
  const best = (links[baseOf(viewer.getScene())] || [])
    .map(l => ({ l, off: Math.abs(norm(l.yaw - yaw)) }))
    .filter(c => c.off <= DBL_CLICK_CONE)
    .sort((p, q) => (p.off + p.l.d * 2) - (q.off + q.l.d * 2))[0];
  if (best) walkTo(best.l); else toast("No scan spot that way");
});

// Preload the neighbouring panoramas so walking feels instant.
const preloaded = new Set();
function preloadAround(id) {
  for (const l of links[id] || []) {
    if (preloaded.has(l.id)) continue;
    preloaded.add(l.id);
    new Image().src = `panos/${l.id}.jpg?v=${IMG_V}`;
  }
}

// plan map: one layer of dots per floor, only the current floor shown
const svg = document.getElementById("map");
const NS = "http://www.w3.org/2000/svg";
const layers = {}, dots = {};
let shownFloor = null;
for (const f of FLOORS) {
  const g = document.createElementNS(NS, "g");
  g.style.display = "none";
  svg.appendChild(g); layers[f.key] = g;
  for (const s of onFloor(f.key)) {
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", s.x); c.setAttribute("cy", -s.y); c.setAttribute("r", 0.5);
    c.setAttribute("class", "dot");
    const t = document.createElementNS(NS, "title"); t.textContent = s.id; c.appendChild(t);
    c.addEventListener("click", () => viewer.loadScene(s.id));
    g.appendChild(c); dots[s.id] = c;
  }
}
const cone = document.createElementNS(NS, "path");
cone.setAttribute("class", "cone");
svg.appendChild(cone);

function showFloor(key) {
  if (shownFloor === key) return;
  shownFloor = key;
  for (const k in layers) layers[k].style.display = k === key ? "" : "none";
  const fs = onFloor(key), pad = 3;
  const xs = fs.map(s => s.x), ys = fs.map(s => s.y);
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad, minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  svg.setAttribute("viewBox", `${minX} ${-maxY} ${maxX - minX} ${maxY - minY}`);
  document.querySelectorAll("#floors button").forEach(b => b.classList.toggle("on", b.dataset.floor === key));
}

// floor tabs: spots per floor, or Pending
const floorsEl = document.getElementById("floors");
for (const f of FLOORS) {
  const n = onFloor(f.key).length;
  const b = document.createElement("button");
  b.type = "button"; b.dataset.floor = f.key;
  b.innerHTML = `${f.name}<small>${n ? n + " spots" : "Pending"}</small>`;
  if (!n) b.disabled = true;
  else b.onclick = () => { if (byId[baseOf(viewer.getScene())].floor !== f.key) viewer.loadScene(startOf(f.key)); };
  floorsEl.appendChild(b);
}

function drawCone() {
  requestAnimationFrame(drawCone);
  const a = byId[baseOf(viewer.getScene())];
  if (!a) return;
  const b = bearingFor(a, viewer.getYaw()), half = viewer.getHfov() / 2, r = 6;
  const p = ang => `${a.x + r * Math.cos(ang * Math.PI / 180)} ${-(a.y + r * Math.sin(ang * Math.PI / 180))}`;
  cone.setAttribute("d", `M${a.x} ${-a.y} L${p(b - half)} A${r} ${r} 0 0 0 ${p(b + half)} Z`);
}

// Before / Render me / Designed: switch the picture but keep looking the same way.
const looksEl = document.getElementById("looks");
const lookChoices = base => !(LOOKS[base] || []).length ? []
  : LOOKS[base].some(l => l.key === "") ? LOOKS[base] : [{ key: "", label: BEFORE_LABEL }, ...LOOKS[base]];
function showLooks(id) {
  const base = baseOf(id), cur = lookOf(id), opts = lookChoices(base);
  looksEl.hidden = !opts.length;
  looksEl.innerHTML = "";
  for (const lk of opts) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = lk.label;
    if (lk.small) b.classList.add("small");
    b.classList.toggle("on", cur === lk.key);
    b.setAttribute("aria-pressed", cur === lk.key);
    b.onclick = () => {
      if (cur === lk.key) return;
      viewer.loadScene(lk.key ? base + SEP + lk.key : base, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
    };
    looksEl.appendChild(b);
  }
}

function onScene(id) {
  const base = baseOf(id), s = byId[base], lk = (LOOKS[base] || []).find(l => l.key === lookOf(id));
  showFloor(s.floor);
  Object.values(dots).forEach(d => d.classList.remove("cur"));
  dots[base].classList.add("cur");
  dots[base].parentNode.appendChild(dots[base]);   // bring to front
  const pl = PLACES.find(p => p.id === base);
  document.getElementById("where").textContent = `${floorName(s.floor)} · ${pl ? pl.name : base}${lk ? " · " + lk.label : ""}`;
  showLooks(id);
}
viewer.on("scenechange", onScene);
let coneRunning = false;
viewer.on("load", () => {
  onScene(viewer.getScene());
  preloadAround(baseOf(viewer.getScene()));
  for (const lk of LOOKS[baseOf(viewer.getScene())] || []) if (lk.file) new Image().src = `panos/${lk.file}?v=${IMG_V}`;
  if (!coneRunning) { coneRunning = true; requestAnimationFrame(drawCone); }
});

function linkHere() {
  const q = new URLSearchParams({ s: viewer.getScene(), y: viewer.getYaw().toFixed(1), p: viewer.getPitch().toFixed(1), f: viewer.getHfov().toFixed(0) });
  return `${location.origin}${location.pathname}#${q}`;
}
viewer.on("animatefinished", () => history.replaceState(null, "", linkHere()));

const toast = msg => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); };
document.getElementById("btnLink").onclick = async () => {
  try { await navigator.clipboard.writeText(linkHere()); toast("Link to this view copied"); }
  catch { toast(linkHere()); }
};
// Phone motion: look around by turning the phone. Only offered on touch devices that support it
// (needs https once hosted). Off by default so people sitting down can just drag.
const btnMotion = document.getElementById("btnMotion");
viewer.on("load", () => {
  if ("ontouchstart" in window && viewer.isOrientationSupported()) btnMotion.hidden = false;
});
btnMotion.onclick = () => {
  if (viewer.isOrientationActive()) { viewer.stopOrientation(); btnMotion.classList.remove("on"); }
  else { viewer.startOrientation(); btnMotion.classList.add("on"); }
};
// Angle finder: frame a still from this panorama (or from the render being shown) with wide lenses and straight verticals.
// Inside the Angle Finder you can step to the next spot (Forward / Left / Right / Back, or the arrow keys):
// it picks the nearest linked spot within 45 degrees of that direction and keeps the same real-world heading.
let afBase = null;
const afPanoFor = (id, lk) => {
  const a = byId[id];
  return { url: `panos/${lk ? lk.file : id + ".jpg"}?v=${IMG_V}`, vaov: a.full ? 180 : VAOV, voff: a.full ? 0 : VOFFSET,
           title: `${floorName(a.floor)} · ${id}${lk ? " · " + lk.label : ""}` };
};
function afNext(dir, yaw) {
  const want = norm(yaw + dir);
  return (links[afBase] || [])
    .map(l => ({ l, off: Math.abs(norm(l.yaw - want)) }))
    .filter(c => c.off <= 45)
    .sort((p, q) => (p.l.d + p.off / 15) - (q.l.d + q.off / 15))[0];
}
document.getElementById("btnAngle").onclick = () => {
  const id = viewer.getScene(), base = baseOf(id);
  const lk = (LOOKS[base] || []).find(l => l.key === lookOf(id));
  afBase = base;
  AngleFinder.open(Object.assign(afPanoFor(base, lk), {
    yaw: viewer.getYaw(), pitch: viewer.getPitch(), hfov: viewer.getHfov(),
    canMove: (dir, yaw) => !!afNext(dir, yaw),
    move: (dir, yaw) => {
      const c = afNext(dir, yaw);
      if (!c) return null;
      // yaw + northOffset is the same real-world heading in every scan
      const newYaw = norm(yaw + scenes[afBase].northOffset - scenes[c.l.id].northOffset);
      afBase = c.l.id;
      viewer.loadScene(afBase, viewer.getPitch(), newYaw, viewer.getHfov());   // the 360 view follows, so Back to 360 lands here
      return Object.assign(afPanoFor(afBase), { yaw: newYaw });
    }
  }));
};
document.getElementById("btnPlan").onclick = e => {
  document.getElementById("plan").classList.toggle("hidden");
  e.currentTarget.classList.toggle("on");
};

// ---------- the one menu (☰): search, Floor, Version, Places, Tools; controls can be resized or hidden ----------
(() => {
  const $ = id => document.getElementById(id);
  const phone = matchMedia("(max-width:760px)");
  const menu = $("menu"), btnMenu = $("btnMenu"), floorsEl = $("floors"), tools = $("tools");
  const search = $("msearch"), results = $("mresults"), body = $("mbody");
  const secs = [...menu.querySelectorAll("details")];
  const nudge = () => setTimeout(() => window.dispatchEvent(new Event("resize")), 30);   // pannellum re-measures on resize
  const store = (k, v) => { try { v === undefined ? (v = localStorage.getItem(k)) : localStorage.setItem(k, v); } catch (e) { v = null; } return v; };
  const isOpen = () => menu.classList.contains("open");

  function openMenu(open) {
    menu.classList.toggle("open", open);
    menu.style.transform = "";
    menu.setAttribute("aria-hidden", !open);
    btnMenu.setAttribute("aria-expanded", open);
    btnMenu.classList.toggle("on", open);
    if (open) { sync(); if (!phone.matches) setTimeout(() => search.focus(), 60); }   // no keyboard popping up on a phone
    else { search.blur(); if (search.value) { search.value = ""; find(""); } }
  }
  // tools always live in the menu; the floors sit in it only on a phone (a laptop keeps the floor bar)
  function place() {
    $("menuTools").appendChild(tools);
    if (phone.matches) $("menuFloors").appendChild(floorsEl);
    else document.body.insertBefore(floorsEl, $("plan"));
    nudge();
  }
  phone.addEventListener("change", place);
  place();
  // the map covers too much of a phone screen to start open
  if (phone.matches) { $("plan").classList.add("hidden"); $("btnPlan").classList.remove("on"); }

  btnMenu.onclick = () => openMenu(!isOpen());
  // picking anything closes the menu so the view is clear again (the size buttons and section headings stay open)
  menu.addEventListener("click", e => { if (e.target.closest("#floors button, #tools button, .mpanel button[data-go], #mresults button")) openMenu(false); });
  document.addEventListener("pointerdown", e => { if (isOpen() && !e.target.closest("#menu, #btnMenu")) openMenu(false); });
  document.addEventListener("keydown", e => {
    const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
    if (e.key === "Escape" && isOpen()) { openMenu(false); btnMenu.focus(); }
    else if (!typing && !e.ctrlKey && !e.metaKey && (e.key === "/" || e.key === "m")) { e.preventDefault(); openMenu(true); setTimeout(() => search.focus(), 60); }
  });

  // one section open at a time, and the last one opened is remembered on this device
  secs.forEach(d => d.addEventListener("toggle", () => {
    if (!d.open) return;
    secs.forEach(o => { if (o !== d) o.open = false; });
    store("scanMenuOpen", d.dataset.k);
  }));
  // on a laptop the Floor section is hidden (the floor bar does that job), so Version opens instead
  function openDefault() {
    let k = store("scanMenuOpen") || (phone.matches ? "floor" : "look");
    if (k === "floor" && !phone.matches) k = "look";
    secs.forEach(d => { d.open = d.dataset.k === k; });
  }
  openDefault();
  phone.addEventListener("change", openDefault);

  // ---------- what each section holds (rebuilt when the menu opens) ----------
  const btn = (label, sub, go, on) => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.go = "1";
    b.innerHTML = `${label}${sub ? `<small>${sub}</small>` : ""}`;
    if (on) b.classList.add("on");
    b.onclick = go;
    return b;
  };
  const placeName = base => (PLACES.find(p => p.id === base) || {}).name;
  const goLook = (base, key) => viewer.loadScene(key ? base + SEP + key : base, viewer.getPitch(), viewer.getYaw(), viewer.getHfov());
  const goPlace = p => {
    const id = p.look && scenes[p.id + SEP + p.look] ? p.id + SEP + p.look : p.id;
    if (p.y !== undefined) viewer.loadScene(id, p.p || 0, p.y, p.f || HFOV); else viewer.loadScene(id);
  };
  function sync() {
    const id = viewer.getScene(), base = baseOf(id), cur = lookOf(id), s = byId[base];
    $("sumFloor").textContent = floorName(s.floor);
    const opts = lookChoices(base), curLook = opts.find(l => l.key === cur);
    $("sumLook").textContent = curLook ? curLook.label : "";
    $("sumPlace").textContent = placeName(base) || "";

    const looks = $("menuLooks"); looks.innerHTML = "";
    if (opts.length) opts.forEach(l => looks.appendChild(btn(l.label, "", () => goLook(base, l.key), l.key === cur)));
    else looks.insertAdjacentHTML("beforeend", '<p class="mnote">This spot has one version. These have more:</p>');
    for (const b of Object.keys(LOOKS)) {
      if (b === base || !byId[b]) continue;
      const first = LOOKS[b].find(l => l.file && !l.small);
      if (first) looks.appendChild(btn(placeName(b) || `${floorName(byId[b].floor)} · ${b}`,
        LOOKS[b].filter(l => !l.small).map(l => l.label).join(" · "), () => viewer.loadScene(b + SEP + first.key)));
    }

    const places = $("menuPlaces"); places.innerHTML = "";
    PLACES.filter(p => byId[p.id]).forEach(p => places.appendChild(btn(p.name, floorName(byId[p.id].floor), () => goPlace(p), p.id === base)));
  }
  viewer.on("scenechange", () => { if (isOpen()) sync(); });

  // ---------- search: places, floors, versions and tools; a scan code like F2-040 works too ----------
  function items() {
    const list = [];
    PLACES.filter(p => byId[p.id]).forEach(p => list.push({ t: p.name, s: floorName(byId[p.id].floor), k: `${p.k || ""} ${floorName(byId[p.id].floor)} place spot`, go: () => goPlace(p) }));
    const fk = { F1: "ground first level 1 one exterior outside street", B: "basement parking garage lower", F2: "second level 2 two upstairs" };
    FLOORS.filter(f => onFloor(f.key).length).forEach(f => list.push({ t: f.name, s: "Floor", k: fk[f.key] || "", go: () => viewer.loadScene(startOf(f.key)) }));
    for (const b of Object.keys(LOOKS)) {
      if (!byId[b]) continue;
      lookChoices(b).forEach(l => list.push({ t: `${l.label}`, s: `Version · ${placeName(b) || b}`, k: "version render look", go: () => viewer.loadScene(l.key ? b + SEP + l.key : b) }));
    }
    [["Plan map", "btnPlan", "map floor plan"], ["Angle finder", "btnAngle", "still photo frame camera"], ["Copy link", "btnLink", "share url"],
     ["Motion", "btnMotion", "gyro turn phone"], ["Hide all controls", "btnHide", "clean picture"]]
      .filter(([, idb]) => !$(idb).hidden)
      .forEach(([t, idb, k]) => list.push({ t, s: "Tool", k, go: () => $(idb).click() }));
    return list;
  }
  function find(q) {
    q = q.trim().toLowerCase();
    results.hidden = !q; body.hidden = !!q;
    results.innerHTML = "";
    if (!q) return;
    const words = q.split(/\s+/);
    let hits = items().filter(i => words.every(w => `${i.t} ${i.s} ${i.k}`.toLowerCase().includes(w)))
      .map(i => Object.assign(i, { r: (i.t.toLowerCase() === q ? 2 : 0) + (i.t.toLowerCase().startsWith(q) ? 1 : 0) }))
      .sort((a, b) => b.r - a.r);   // exact name first, then names that start with what was typed
    if (!hits.length && q.length >= 3) {
      hits = S.filter(s => s.id.toLowerCase().includes(q)).slice(0, 8)
        .map(s => ({ t: s.id, s: floorName(s.floor), go: () => viewer.loadScene(s.id) }));
    }
    if (!hits.length) { results.innerHTML = '<p class="mnote">Nothing by that name. Try "entrance", "Level 2" or "designed".</p>'; return; }
    hits.slice(0, 14).forEach(i => results.appendChild(btn(i.t, i.s, i.go)));
  }
  search.addEventListener("input", () => find(search.value));
  search.addEventListener("keydown", e => { if (e.key === "Enter") { const b = results.querySelector("button"); if (b) b.click(); } });

  // ---------- phone: drag the sheet down to close it ----------
  let y0 = null, dy = 0;
  menu.addEventListener("touchstart", e => {
    if (!phone.matches || e.touches.length > 1) return;
    const inList = e.target.closest("#mbody, #mresults");
    if (inList && inList.scrollTop > 0) return;   // a list scrolled down scrolls back up first
    y0 = e.touches[0].clientY; dy = 0;
  }, { passive: true });
  menu.addEventListener("touchmove", e => {
    if (y0 === null) return;
    dy = Math.max(0, e.touches[0].clientY - y0);
    if (dy > 6) { menu.classList.add("drag"); menu.style.transform = `translateY(${dy}px)`; }
  }, { passive: true });
  menu.addEventListener("touchend", () => {
    if (y0 === null) return;
    menu.classList.remove("drag");
    if (dy > 90) openMenu(false); else menu.style.transform = "";
    y0 = null;
  });

  // control size, remembered on this device
  const setSize = s => {
    document.body.dataset.ui = s;
    document.querySelectorAll("#uiSize button").forEach(b => b.classList.toggle("on", b.dataset.s === s));
    store("scanUiSize", s);
  };
  document.querySelectorAll("#uiSize button").forEach(b => b.onclick = () => setSize(b.dataset.s));
  setSize(store("scanUiSize") || "m");

  // hide everything but the picture
  const bare = on => {
    document.body.classList.toggle("bare", on);
    $("btnShow").hidden = !on;
    openMenu(false);
    nudge();
  };
  $("btnHide").onclick = () => bare(true);
  $("btnShow").onclick = () => bare(false);
})();

// Title page: Fairfax & Sammons 360 Viewer -> 150 Worth Ave -> Before / Render me / Designed.
// Every link opens here; the choice decides which picture the shared view starts on.
(() => {
  const intro = document.getElementById("intro");
  const place = document.getElementById("introPlace");
  const choose = document.getElementById("introChoose");
  const hint = document.getElementById("introHint");
  // a link ending in &skip=1 goes straight into the view, with no title page (used by the pop-up on the plan page)
  if (h.has("skip")) { intro.style.display = "none"; intro.hidden = true; return; }
  const base = baseOf(first);
  const view = { pitch: h.has("y") ? +h.get("p") || 0 : null, yaw: h.has("y") ? +h.get("y") : null, hfov: +h.get("f") || (base === START ? START_VIEW.hfov : HFOV) };
  for (const lk of LOOKS[base] || []) if (lk.file) new Image().src = `panos/${lk.file}?v=${IMG_V}`;   // ready before anyone clicks

  function enter(target) {
    if (target !== viewer.getScene()) {
      viewer.loadScene(target, view.pitch ?? viewer.getPitch(), view.yaw ?? viewer.getYaw(), view.hfov);
    }
    intro.classList.add("out");
    setTimeout(() => { intro.hidden = true; }, 480);
  }

  place.onclick = () => {
    const opts = lookChoices(base);
    if (!opts.length) return enter(base);              // no renders here: go straight in
    if (place.getAttribute("aria-expanded") === "true") return;
    place.setAttribute("aria-expanded", "true");
    for (const lk of opts) {
      if (lk.small) continue;                          // small extras stay in the viewer only
      const b = document.createElement("button");
      b.type = "button"; b.textContent = lk.label;
      b.onclick = () => enter(lk.key ? base + SEP + lk.key : base);
      choose.appendChild(b);
    }
    choose.hidden = false; hint.hidden = false;
    choose.querySelector("button").focus();
  };
})();
</script>
</body>
</html>
