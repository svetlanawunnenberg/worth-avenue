<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#161310">
<title>Presentation &middot; 150 Worth Avenue &middot; Fairfax &amp; Sammons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">

<!-- =====================================================================
     PRESENTATION VIEWER
     Shows the pitch deck as pictures: one slide at a time, a grid, or one
     long scroll. The slides are assets/deck/slide-01.jpg, slide-02.jpg ...
     (thumbnails in assets/deck/thumbs/). Which PDF and how many slides is
     set in portal-data.js under "presentation".
     Keys on a laptop: arrows / space = next and back, G = grid,
     S = scroll, F = full screen, Home / End = first and last.
     ===================================================================== -->
<style>
  :root{ --ink:#161310; --ink-2:#221E19; --ivory:#F4EFE4; --brass:#8A6D3B; --line:rgba(244,239,228,.18); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--ink); color:var(--ivory); font-family:'Inter',-apple-system,'Segoe UI',sans-serif; }
  body{ overflow:hidden; -webkit-tap-highlight-color:transparent; }
  body.v-grid, body.v-scroll{ overflow:auto; }
  button{ font:inherit; color:inherit; }

  /* ---------- top corners: home and counter ---------- */
  .corner{ position:fixed; top:calc(10px + env(safe-area-inset-top)); z-index:30; display:flex; align-items:center;
    height:40px; padding:0 12px; background:rgba(22,19,16,.72); border:1px solid var(--line); color:var(--ivory);
    text-decoration:none; font-size:13px; font-weight:600; letter-spacing:.08em; font-variant-numeric:tabular-nums;
    transition:opacity .3s ease; }
  .home{ left:calc(10px + env(safe-area-inset-left)); width:40px; padding:0; justify-content:center; }
  .home svg{ width:20px; height:20px; }
  .count{ right:calc(10px + env(safe-area-inset-right)); }

  /* ---------- the tool bar (symbols only) ---------- */
  .bar{ position:fixed; left:50%; bottom:calc(12px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30;
    display:flex; gap:2px; padding:4px; background:rgba(22,19,16,.86); border:1px solid var(--line);
    box-shadow:0 10px 34px rgba(0,0,0,.45); transition:opacity .3s ease; }
  .bar button, .bar a{ width:48px; height:48px; display:inline-flex; align-items:center; justify-content:center; padding:0;
    border:0; background:transparent; color:var(--ivory); cursor:pointer; text-decoration:none; }
  .bar button:hover, .bar a:hover{ background:rgba(244,239,228,.12); }
  .bar button:focus-visible, .bar a:focus-visible, .corner:focus-visible{ outline:2px solid var(--brass); outline-offset:-2px; }
  .bar .on{ background:var(--ivory); color:var(--ink); }
  .bar .on:hover{ background:var(--ivory); }
  .bar .sep{ width:1px; margin:8px 3px; background:var(--line); }
  .bar svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .bar [disabled]{ opacity:.3; cursor:default; }
  body:not(.v-slide) .nav{ display:none; }
  body.idle .bar, body.idle .corner{ opacity:0; pointer-events:none; }
  body.idle{ cursor:none; }

  /* ---------- one slide at a time ---------- */
  .stage{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; touch-action:pan-y pinch-zoom;
    user-select:none; -webkit-user-select:none; }
  body.v-slide .stage{ display:flex; }
  .stage img{ display:block; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; -webkit-user-drag:none; }
  .side{ position:absolute; top:0; bottom:0; width:30%; z-index:2; cursor:pointer; }
  .side.prev{ left:0; } .side.next{ right:0; }
  @media (hover:hover) and (pointer:fine){
    .side::after{ content:''; position:absolute; top:50%; width:14px; height:14px; margin-top:-7px; border:solid var(--ivory);
      border-width:0 2px 2px 0; opacity:0; transition:opacity .2s ease; }
    .side.prev::after{ left:26px; transform:rotate(135deg); }
    .side.next::after{ right:26px; transform:rotate(-45deg); }
    .side:hover::after{ opacity:.7; }
  }

  /* ---------- grid ---------- */
  .grid{ display:none; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; max-width:1500px; margin:0 auto;
    padding:calc(64px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom)); }
  body.v-grid .grid{ display:grid; }
  .grid button{ position:relative; display:block; padding:0; border:1px solid var(--line); background:var(--ink-2); cursor:pointer; aspect-ratio:16/9; }
  .grid button:hover{ border-color:var(--ivory); }
  .grid button.now{ outline:3px solid var(--brass); outline-offset:2px; }
  .grid img{ display:block; width:100%; height:100%; object-fit:contain; }
  .num{ position:absolute; left:6px; top:6px; min-width:26px; height:22px; padding:0 6px; display:flex; align-items:center; justify-content:center;
    background:rgba(22,19,16,.8); color:var(--ivory); font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- one long scroll ---------- */
  .scroll{ display:none; flex-direction:column; align-items:center; gap:12px;
    padding:calc(64px + env(safe-area-inset-top)) 0 calc(96px + env(safe-area-inset-bottom)); }
  body.v-scroll .scroll{ display:flex; }
  .scroll figure{ position:relative; margin:0; width:min(100%, 1500px); aspect-ratio:16/9; background:var(--ink-2); }
  .scroll img{ display:block; width:100%; height:100%; object-fit:contain; }

  @media (max-width:520px){
    .grid{ grid-template-columns:repeat(2,1fr); gap:8px; padding-left:8px; padding-right:8px; }
    .bar button, .bar a{ width:44px; height:48px; }
    .bar .sep{ margin:8px 1px; }
  }
</style>
</head>
<body class="v-slide">

<a class="corner home" id="home" href="../" title="Back to the dashboard" aria-label="Back to the dashboard">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"/></svg>
</a>
<div class="corner count" id="count" aria-live="polite"></div>

<div class="stage" id="stage">
  <img id="slide" alt="">
  <div class="side prev" id="sidePrev" aria-hidden="true"></div>
  <div class="side next" id="sideNext" aria-hidden="true"></div>
</div>
<div class="grid" id="grid"></div>
<div class="scroll" id="scroll"></div>

<nav class="bar" id="bar" aria-label="Presentation">
  <button type="button" class="nav" id="prev" title="Back (left arrow)" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button type="button" data-v="slide" title="One slide at a time" aria-label="One slide at a time"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1"/></svg></button>
  <button type="button" data-v="grid" title="All slides (G)" aria-label="All slides"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="7" height="6"/><rect x="13.5" y="4.5" width="7" height="6"/><rect x="3.5" y="13.5" width="7" height="6"/><rect x="13.5" y="13.5" width="7" height="6"/></svg></button>
  <button type="button" data-v="scroll" title="Scroll through (S)" aria-label="Scroll through"><svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="8"/><rect x="4" y="13.5" width="16" height="8"/></svg></button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" id="full" title="Full screen (F)" aria-label="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <a id="pdf" title="Download the PDF" aria-label="Download the PDF" download><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></a>
  <button type="button" class="nav" id="next" title="Next (right arrow or space)" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</nav>

<script src="../portal-data.js"></script>
<script>
(function(){
  var D = (window.PORTAL && window.PORTAL.presentation) || {};
  var N = D.count || 0, DIR = "../" + (D.slides || "assets/deck/");
  var $ = function(id){ return document.getElementById(id); };
  var at = 1, view = "slide", FINE = window.matchMedia("(hover:hover) and (pointer:fine)");

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function big(n){ return DIR + "slide-" + pad(n) + ".jpg"; }
  function small(n){ return DIR + "thumbs/slide-" + pad(n) + ".jpg"; }
  function clamp(n){ return Math.max(1, Math.min(N, n)); }

  if(D.pdf) $("pdf").href = "../" + D.pdf; else $("pdf").hidden = true;
  /* home goes back to the page you came from on this site (Yael's page, the exports list), else to the dashboard */
  try{ var ref = new URL(document.referrer); if(ref.origin === location.origin && ref.pathname !== location.pathname) $("home").href = ref.href; }catch(e){}
  if(D.title) document.title = D.title + " · 150 Worth Avenue · Fairfax & Sammons";

  /* grid and scroll are built once; their pictures load only as they come into view */
  var gridBtns = [], figs = [];
  for(var i = 1; i <= N; i++){
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("aria-label", "Slide " + i);
    b.innerHTML = '<img loading="lazy" alt="" src="' + small(i) + '"><span class="num">' + i + '</span>';
    b.addEventListener("click", (function(n){ return function(){ go(n); setView("slide"); }; })(i));
    $("grid").appendChild(b); gridBtns.push(b);

    var f = document.createElement("figure");
    f.id = "s" + i; f.setAttribute("data-n", i);
    f.innerHTML = '<img loading="lazy" alt="Slide ' + i + '" src="' + big(i) + '"><span class="num">' + i + '</span>';
    $("scroll").appendChild(f); figs.push(f);
  }

  /* ---------- moving between slides ---------- */
  var want = 0;
  function show(){
    var img = $("slide"), n = at; want = n;
    if(!img.getAttribute("src")) img.src = small(n);
    var full = new Image();
    full.onload = function(){ if(want === n) img.src = full.src; };
    full.src = big(n);
    if(!full.complete) img.src = small(n);      // the small picture first, so a tap always shows something at once
    img.alt = "Slide " + n + " of " + N;
    [n + 1, n - 1, n + 2].forEach(function(k){ if(k >= 1 && k <= N) new Image().src = big(k); });
  }
  function go(n, quiet){
    at = clamp(n);
    $("count").textContent = at + " / " + N;
    $("prev").disabled = at === 1; $("next").disabled = at === N;
    gridBtns.forEach(function(b, k){ b.classList.toggle("now", k + 1 === at); });
    if(view === "slide") show();
    if(!quiet) save();
  }
  function save(){ try{ history.replaceState(null, "", "#" + at + (view === "slide" ? "" : "-" + view)); }catch(e){} }

  function setView(v){
    view = v;
    document.body.className = "v-" + v;
    var vb = document.querySelectorAll("[data-v]");
    for(var k = 0; k < vb.length; k++) vb[k].classList.toggle("on", vb[k].getAttribute("data-v") === v);
    if(v === "slide"){ show(); window.scrollTo(0, 0); }
    if(v === "grid"){ var g = gridBtns[at - 1]; if(g) g.scrollIntoView({ block:"center" }); }
    if(v === "scroll"){ var s = figs[at - 1]; if(s) s.scrollIntoView({ block:"start" }); window.scrollBy(0, -60); }
    save(); wake();
  }

  /* in the scroll, the counter follows whichever slide fills the screen */
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      if(view !== "scroll") return;
      es.forEach(function(e){ if(e.isIntersecting) go(+e.target.getAttribute("data-n")); });
    }, { rootMargin:"-45% 0px -45% 0px" });
    figs.forEach(function(f){ io.observe(f); });
  }

  $("prev").addEventListener("click", function(){ go(at - 1); });
  $("next").addEventListener("click", function(){ go(at + 1); });
  $("sidePrev").addEventListener("click", function(){ if(!swiped) go(at - 1); });
  $("sideNext").addEventListener("click", function(){ if(!swiped) go(at + 1); });
  var vb = document.querySelectorAll("[data-v]");
  for(var k = 0; k < vb.length; k++) vb[k].addEventListener("click", function(){ setView(this.getAttribute("data-v")); });

  /* ---------- swipe on a phone or tablet (leaves pinch-to-zoom alone) ---------- */
  var sx = 0, sy = 0, many = false, swiped = false;
  $("stage").addEventListener("touchstart", function(e){
    many = e.touches.length > 1; swiped = false;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive:true });
  $("stage").addEventListener("touchmove", function(e){ if(e.touches.length > 1) many = true; }, { passive:true });
  $("stage").addEventListener("touchend", function(e){
    if(many || (window.visualViewport && window.visualViewport.scale > 1.05)) return;
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.2){
      swiped = true; go(at + (dx < 0 ? 1 : -1));
      setTimeout(function(){ swiped = false; }, 350);
    }
  });

  /* ---------- keys on a laptop ---------- */
  document.addEventListener("keydown", function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if(view === "slide" && (k === "ArrowRight" || k === "PageDown" || k === " " || k === "ArrowDown")){ e.preventDefault(); go(at + 1); }
    else if(view === "slide" && (k === "ArrowLeft" || k === "PageUp" || k === "ArrowUp")){ e.preventDefault(); go(at - 1); }
    else if(k === "Home"){ e.preventDefault(); go(1); if(view === "scroll") setView("scroll"); }
    else if(k === "End"){ e.preventDefault(); go(N); if(view === "scroll") setView("scroll"); }
    else if(k === "g" || k === "G"){ setView(view === "grid" ? "slide" : "grid"); }
    else if(k === "s" || k === "S"){ setView(view === "scroll" ? "slide" : "scroll"); }
    else if(k === "f" || k === "F"){ toggleFull(); }
    else if(k === "Escape" && view !== "slide"){ setView("slide"); }
    wake();
  });

  /* ---------- full screen, where the browser allows it (not on iPhone) ---------- */
  var de = document.documentElement;
  var canFull = !!(de.requestFullscreen || de.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  if(canFull) $("full").hidden = false;
  function isFull(){ return document.fullscreenElement || document.webkitFullscreenElement; }
  function toggleFull(){
    if(!canFull) return;
    if(isFull()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else (de.requestFullscreen || de.webkitRequestFullscreen).call(de);
  }
  $("full").addEventListener("click", toggleFull);
  function fullIcon(){
    $("full").innerHTML = isFull()
      ? '<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  }
  document.addEventListener("fullscreenchange", fullIcon);
  document.addEventListener("webkitfullscreenchange", fullIcon);

  /* ---------- on a laptop, the buttons fade while presenting and come back when the mouse moves ---------- */
  var idleT;
  function wake(){
    document.body.classList.remove("idle"); clearTimeout(idleT);
    if(FINE.matches && view === "slide") idleT = setTimeout(function(){ document.body.classList.add("idle"); }, 2600);
  }
  document.addEventListener("mousemove", wake);
  $("bar").addEventListener("mouseenter", function(){ clearTimeout(idleT); });

  /* ---------- start where the link says (#12, #12-grid, #12-scroll) ---------- */
  var h = (location.hash || "").replace("#", "").split("-");
  at = clamp(parseInt(h[0], 10) || 1);
  setView(h[1] === "grid" || h[1] === "scroll" ? h[1] : "slide");
  go(at, true);
})();
</script>
</body>
</html>
