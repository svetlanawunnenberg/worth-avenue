<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>360 on the Elevation &middot; Burlington Arcade &middot; Fairfax &amp; Sammons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../portal.css">
<link rel="stylesheet" href="../menu.css">

<!-- =====================================================================
     360 ON THE ELEVATION
     The street elevation is assets/elevation-worth.jpg (1269 x 152 pixels).
     Each dot is one scan spot on Worth Avenue. x is the dot's place along
     the elevation in pixels; yaw is the way the box first looks (about 90
     faces the building). To add or swap a dot, add a line to SPOTS below:
       { n:7, id:"Fasad__Scan_000", x:600, yaw:90, name:"Words shown" }
     ===================================================================== -->
<style>
  .wrap.wide{ max-width:1240px; }
  body.has-win .wrap{ padding-bottom:60vh; }
  .bar{ display:flex; justify-content:center; gap:10px; margin:26px 0 0; }
  .textbtn{ border:1px solid var(--ink); background:var(--white); color:var(--ink); padding:11px 18px; font:inherit;
    font-size:10px; letter-spacing:.17em; text-transform:uppercase; cursor:pointer; }
  .textbtn:hover{ background:var(--ink); color:var(--ivory); }

  .elevbox{ margin-top:16px; border:1px solid var(--line); background:var(--white); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .elev{ position:relative; min-width:820px; line-height:0; }
  .elev img{ width:100%; height:auto; display:block; }
  .elev svg{ position:absolute; inset:0; width:100%; height:100%; }
  .dot{ cursor:pointer; outline:none; }
  .dot .ring{ fill:rgba(255,255,255,.95); stroke:var(--ink); stroke-width:3; transition:fill .15s ease, stroke .15s ease; }
  .dot text{ font-family:'Inter',sans-serif; font-size:13px; font-weight:600; fill:var(--ink); text-anchor:middle; pointer-events:none; }
  .dot:hover .ring,.dot:focus-visible .ring,.dot.on .ring{ fill:var(--brass); stroke:var(--brass); }
  .dot:hover text,.dot:focus-visible text,.dot.on text{ fill:var(--white); }
  .dot .hit{ fill:transparent; }
  .hint{ font-size:.85rem; color:var(--ink-soft); margin:12px 0 0; text-align:center; }

  .spots{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:8px; }
  .spots button{ display:flex; gap:12px; align-items:center; width:100%; background:var(--white); border:1px solid var(--line);
    padding:12px 16px; font:inherit; color:var(--ink); text-align:left; cursor:pointer; }
  .spots button:hover{ border-color:var(--brass); }
  .spots b{ flex:none; width:28px; height:28px; border:2px solid var(--ink); border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:12px; }

  /* ---------- the movable 360 boxes ---------- */
  .win{ position:fixed; z-index:200; display:flex; flex-direction:column; width:520px; height:360px; min-width:260px; min-height:200px;
    max-width:96vw; max-height:92vh; resize:both; overflow:hidden; background:var(--white); border:1px solid var(--ink);
    box-shadow:0 14px 44px rgba(22,19,16,.34); }
  .win.top{ box-shadow:0 18px 56px rgba(22,19,16,.46); }
  .win-bar{ flex:none; display:flex; align-items:center; gap:6px; padding:4px 6px 4px 10px; background:var(--ivory-deep);
    border-bottom:1px solid var(--line); cursor:move; touch-action:none; user-select:none; }
  .win-grip{ flex:none; width:14px; height:18px; color:var(--ink-soft); opacity:.7; }
  .win-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-family:'EB Garamond',Georgia,serif; font-size:1.05rem; font-weight:600; }
  .win-btn{ flex:none; width:34px; height:34px; display:inline-flex; align-items:center; justify-content:center; padding:0;
    border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer; text-decoration:none; }
  .win-btn:hover,.win-btn:focus-visible{ background:var(--ink); color:var(--ivory); }
  .win-btn svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .win-share{ flex:none; height:30px; padding:0 10px; border:1px solid var(--ink); background:var(--white); color:var(--ink); cursor:pointer;
    font:inherit; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
  .win-share:hover,.win-share:focus-visible{ background:var(--ink); color:var(--ivory); }
  .win iframe{ flex:1; min-height:0; width:100%; border:0; background:#0d0b09; display:block; }
  body.dragging .win iframe{ pointer-events:none; }

  .toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:320; background:var(--ink); color:var(--ivory);
    padding:11px 16px; font-size:.85rem; opacity:0; pointer-events:none; transition:opacity .2s ease; max-width:90vw; }
  .toast.show{ opacity:1; }

  /* ---------- the tour (only when someone asks for it) ---------- */
  .ring-on{ outline:3px solid var(--brass); outline-offset:5px; position:relative; z-index:210; }
  .coach{ position:fixed; z-index:330; left:50%; bottom:20px; transform:translateX(-50%); width:min(440px,calc(100vw - 24px));
    background:var(--white); border:1px solid var(--ink); box-shadow:0 14px 44px rgba(22,19,16,.4); padding:16px 18px; display:none; }
  .coach.show{ display:block; }
  .coach .cs{ font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin:0 0 6px; }
  .coach p.ct{ margin:0 0 14px; font-size:.95rem; line-height:1.5; }
  .coach .cn{ display:flex; gap:8px; align-items:center; }
  .coach .cn .sp{ flex:1; }

  @media (max-width:720px){
    .win{ left:8px !important; right:8px; top:auto !important; bottom:8px; width:auto !important; height:62vh !important; resize:none; max-width:none; }
    .win-bar{ cursor:default; } .win-grip{ display:none; }
    .coach{ bottom:calc(62vh + 16px); }
  }
  /* ?embed=1: shown inside another page (navigation/), so no header or menu of its own */
  html.embed .header-band, html.embed .pmenu-btn, html.embed .pmenu, html.embed .pmenu-shade{ display:none !important; }
</style>
</head>
<body>
<script>if (/[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('embed');</script>

<div class="header-band">
  <img src="../assets/burlington-header.png" alt="Burlington Arcade, Fairfax &amp; Sammons, New York ~ Palm Beach">
</div>

<div class="wrap wide">
  <div class="ptitle">
    <p class="eyebrow">Cassandra &middot; Toolkit</p>
    <h1>360 on the Elevation</h1>
    <p class="subtitle">Tap a dot along Worth Avenue to look around from that spot.</p>
    <a class="back" href="../cassandra/toolkit/">&larr; Toolkit</a>
  </div>

  <div class="bar"><button class="textbtn" type="button" id="tourBtn">Tour</button></div>

  <div class="elevbox" id="elevbox">
    <div class="elev" id="elev">
      <img src="../assets/elevation-worth.jpg" width="1269" height="152" alt="The Worth Avenue street elevation of 150 Worth Avenue">
      <svg viewBox="0 0 1269 152" id="dots" role="group" aria-label="Scan spots along Worth Avenue"></svg>
    </div>
  </div>
  <p class="hint">On a phone, slide the elevation sideways to see all of it. Open as many boxes as you like.</p>

  <p class="section-label">Or pick from the list</p>
  <ul class="spots" id="spots"></ul>
</div>

<div class="toast" id="toast" role="status"></div>
<div class="coach" id="coach" role="dialog" aria-label="Tour">
  <p class="cs" id="coachStep"></p>
  <p class="ct" id="coachText"></p>
  <div class="cn">
    <button class="textbtn" type="button" id="coachBack">Back</button>
    <span class="sp"></span>
    <button class="textbtn" type="button" id="coachEnd">End</button>
    <button class="textbtn" type="button" id="coachNext" style="background:var(--ink);color:var(--ivory)">Next</button>
  </div>
</div>

<script>
/* x is in elevation-picture pixels (1269 wide); the dots sit just under the ground line, right to left along the street. */
var SPOTS = [
  { n:1, id:"Fasad__Scan_471", x:1164, yaw:90.1, name:"Far right" },
  { n:2, id:"Fasad__Scan_465", x:937,  yaw:90.1, name:"Where the arches start" },
  { n:3, id:"Fasad__Scan_458", x:705,  yaw:89.7, name:"Where the arches stop" },
  { n:4, id:"Fasad__Scan_452", x:486,  yaw:89.8, name:"The 150 Worth entrance" },
  { n:5, id:"Fasad__Scan_448", x:339,  yaw:87.7, name:"The five bays" },
  { n:6, id:"Fasad__Scan_443", x:199,  yaw:88.5, name:"The garages" }
];
var DOT_Y = 128, W = 1269, NS = "http://www.w3.org/2000/svg";
var PITCH = 6, FOV = 85;
var svg = document.getElementById("dots"), elev = document.getElementById("elev");
var open = {}, zTop = 200, STORE = "elev360-boxes";

var ICON = {
  grip:  '<svg viewBox="0 0 14 18"><g fill="currentColor" stroke="none"><circle cx="4" cy="3" r="1.6"/><circle cx="10" cy="3" r="1.6"/><circle cx="4" cy="9" r="1.6"/><circle cx="10" cy="9" r="1.6"/><circle cx="4" cy="15" r="1.6"/><circle cx="10" cy="15" r="1.6"/></g></svg>',
  tab:   '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  save:  '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* v = { y, p, f } (turn, tilt, zoom) from a shared link; left out, the box starts facing the building */
function hash(s, mode, v){
  v = v || {};
  return "#s=" + s.id + "&y=" + (v.y != null ? v.y : s.yaw) + "&p=" + (v.p != null ? v.p : PITCH) + "&f=" + (v.f != null ? v.f : FOV) + (mode ? "&skip=" + mode : "");
}
function boxHash(s, frame){   // "spot=4&y=89.8&p=6.0&f=85": this spot, looking exactly the way the box looks now
  var y = s.yaw, p = PITCH, f = FOV;
  try{ var v = frame.contentWindow.eval("viewer"); y = v.getYaw().toFixed(1); p = v.getPitch().toFixed(1); f = Math.round(v.getHfov()); }catch(e){}
  return "spot=" + s.n + "&y=" + y + "&p=" + p + "&f=" + f;
}
function toast(msg){
  var t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function remembered(){ try{ return JSON.parse(localStorage.getItem(STORE) || "{}"); }catch(e){ return {}; } }
function remember(id, w){
  try{
    var all = remembered(), r = w.getBoundingClientRect();
    all[id] = { l:Math.round(r.left), t:Math.round(r.top), w:Math.round(r.width), h:Math.round(r.height) };
    localStorage.setItem(STORE, JSON.stringify(all));
  }catch(e){}
}
function raise(w){
  for(var k in open) open[k].classList.remove("top");
  w.style.zIndex = ++zTop; w.classList.add("top");
}
function phone(){ return window.matchMedia("(max-width:720px)").matches; }

function openSpot(s, view){
  if(open[s.id]){ raise(open[s.id]); return; }
  var w = document.createElement("div");
  w.className = "win"; w.setAttribute("role", "dialog"); w.setAttribute("aria-label", "360 view, " + s.name);

  var bar = document.createElement("div"); bar.className = "win-bar";
  bar.innerHTML = '<span class="win-grip" aria-hidden="true">' + ICON.grip + '</span>';
  var title = document.createElement("span"); title.className = "win-title"; title.textContent = s.n + " · " + s.name;
  bar.appendChild(title);

  var share = document.createElement("button");
  share.type = "button"; share.className = "win-share"; share.textContent = "Share link"; share.title = "Copy a link to exactly what you see";
  var tab = document.createElement("a");
  tab.className = "win-btn"; tab.innerHTML = ICON.tab; tab.title = "Open in a new tab"; tab.setAttribute("aria-label", "Open in a new tab");
  tab.href = "../scan/" + hash(s, 2, view); tab.target = "_blank"; tab.rel = "noopener";
  var save = document.createElement("button");
  save.type = "button"; save.className = "win-btn"; save.innerHTML = ICON.save; save.title = "Save a picture of this view"; save.setAttribute("aria-label", "Save a picture of this view");
  var close = document.createElement("button");
  close.type = "button"; close.className = "win-btn"; close.innerHTML = ICON.close; close.title = "Close"; close.setAttribute("aria-label", "Close");
  bar.appendChild(share); bar.appendChild(tab); bar.appendChild(save); bar.appendChild(close);

  var frame = document.createElement("iframe");
  frame.title = "360 view, " + s.name; frame.src = "../scan/" + hash(s, 1, view);
  frame.setAttribute("allow", "fullscreen; accelerometer; gyroscope"); frame.setAttribute("allowfullscreen", "");
  w.appendChild(bar); w.appendChild(frame);
  document.body.appendChild(w);

  /* first place: where it was last left, else under the elevation, a little stepped for each box */
  var mem = remembered()[s.id], n = Object.keys(open).length;
  var eb = document.getElementById("elevbox"), er = eb.getBoundingClientRect();
  if(!phone() && n === 0 && er.bottom + 22 + 360 > window.innerHeight){   // not enough room under the elevation: bring it to the top first
    document.body.classList.add("has-win");   // gives the page enough length to scroll that far
    window.scrollTo(0, window.scrollY + er.top - 64); er = eb.getBoundingClientRect();
  }
  var L = 40 + n * 34, T = (phone() ? 0 : Math.max(70, er.bottom + 16)) + n * 30;
  if(!phone()) w.style.height = Math.max(240, Math.min(360, window.innerHeight - T - 14)) + "px";
  if(mem && mem.w){ w.style.width = mem.w + "px"; w.style.height = mem.h + "px"; L = mem.l; T = mem.t; }
  L = Math.max(0, Math.min(window.innerWidth - 120, L)); T = Math.max(0, Math.min(window.innerHeight - 80, T));
  w.style.left = L + "px"; w.style.top = T + "px";

  open[s.id] = w; raise(w);
  var g = svg.querySelector('[data-id="' + s.id + '"]'); if(g) g.classList.add("on");

  function shut(){
    remember(s.id, w); w.remove(); delete open[s.id];
    var g2 = svg.querySelector('[data-id="' + s.id + '"]'); if(g2) g2.classList.remove("on");
  }
  close.addEventListener("click", shut);
  share.addEventListener("click", function(){
    var rel = "elevation360/#" + boxHash(s, frame);
    if(window.FS) FS.copy(rel, "Link to " + s.name + ", exactly as you see it, copied.");
    else if(navigator.clipboard) navigator.clipboard.writeText(location.origin + location.pathname + "#" + boxHash(s, frame));
  });
  save.addEventListener("click", function(){
    try{
      var v = frame.contentWindow.eval("viewer");
      v.setYaw(v.getYaw() + 0.0001, false);   // a tiny turn makes the viewer draw the picture again, so it can be read
      var cv = v.getContainer().querySelector("canvas");
      var a = document.createElement("a");
      a.href = cv.toDataURL("image/jpeg", 0.92); a.download = "Worth-Avenue-view-" + s.n + ".jpg";
      document.body.appendChild(a); a.click(); a.remove();
      toast("Saved a picture of what you see.");
    }catch(e){ toast("The picture is still loading. Try again in a moment."); }
  });

  w.addEventListener("pointerdown", function(){ raise(w); }, true);
  w.addEventListener("pointerup", function(){ remember(s.id, w); });   // covers moving and resizing

  /* move by the top bar (not on a phone, where the box sits at the bottom) */
  bar.addEventListener("pointerdown", function(e){
    if(phone() || e.target.closest(".win-btn")) return;
    var r = w.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    document.body.classList.add("dragging"); bar.setPointerCapture(e.pointerId);
    function mv(ev){
      var x = Math.max(-r.width + 90, Math.min(window.innerWidth - 90, ev.clientX - dx));
      var y = Math.max(0, Math.min(window.innerHeight - 40, ev.clientY - dy));
      w.style.left = x + "px"; w.style.top = y + "px";
    }
    function up(){ document.body.classList.remove("dragging"); bar.removeEventListener("pointermove", mv); bar.removeEventListener("pointerup", up); remember(s.id, w); }
    bar.addEventListener("pointermove", mv); bar.addEventListener("pointerup", up);
  });
  return w;
}

/* dots and list */
SPOTS.forEach(function(s){
  var g = document.createElementNS(NS, "g");
  g.setAttribute("class", "dot"); g.setAttribute("tabindex", "0"); g.setAttribute("role", "button"); g.setAttribute("data-id", s.id);
  g.setAttribute("aria-label", "Spot " + s.n + ", " + s.name);
  var tt = document.createElementNS(NS, "title"); tt.textContent = s.n + " · " + s.name;
  var hit = document.createElementNS(NS, "circle"); hit.setAttribute("class", "hit"); hit.setAttribute("cx", s.x); hit.setAttribute("cy", DOT_Y); hit.setAttribute("r", 20);
  var ring = document.createElementNS(NS, "circle"); ring.setAttribute("class", "ring"); ring.setAttribute("cx", s.x); ring.setAttribute("cy", DOT_Y); ring.setAttribute("r", 11);
  var t = document.createElementNS(NS, "text"); t.setAttribute("x", s.x); t.setAttribute("y", DOT_Y + 4.5); t.textContent = s.n;
  g.appendChild(tt); g.appendChild(hit); g.appendChild(ring); g.appendChild(t);
  g.addEventListener("click", function(){ openSpot(s); });
  g.addEventListener("keydown", function(e){ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openSpot(s); } });
  svg.appendChild(g);

  var li = document.createElement("li"), b = document.createElement("button");
  b.type = "button";
  var nb = document.createElement("b"); nb.textContent = s.n;
  b.appendChild(nb); b.appendChild(document.createTextNode(s.name));
  b.addEventListener("click", function(){ openSpot(s); });
  li.appendChild(b); document.getElementById("spots").appendChild(li);
});

/* a shared link (#spot=4&y=..&p=..&f=..) opens that box, looking the same way */
(function(){
  var h = location.hash.slice(1), m = h.match(/(^|&)spot=([0-9]+)/);
  if(!m) return;
  var s = SPOTS.filter(function(x){ return x.n === +m[2]; })[0];
  if(!s) return;
  function num(k){ var q = h.match(new RegExp("(^|&)" + k + "=(-?[0-9.]+)")); return q ? q[2] : null; }
  openSpot(s, { y:num("y"), p:num("p"), f:num("f") });
})();

/* ---------- the tour: only runs when someone taps Tour ---------- */
var STEPS = [
  { text:"These six dots sit along Worth Avenue. Tap one to look around from that spot.", target:function(){ return document.getElementById("elevbox"); } },
  { text:"A box opens with the 360. Drag inside it to look around, or use the plus and minus to zoom.", before:function(){ if(!Object.keys(open).length) openSpot(SPOTS[3]); },
    target:function(){ return firstWin(); } },
  { text:"Drag the top bar to move the box. Pull its bottom corner to make it bigger or smaller.", target:function(){ var w = firstWin(); return w && w.querySelector(".win-bar"); } },
  { text:"Share link copies a link to exactly what you see. The symbols: open in a new tab, save a picture, and close.", target:function(){ var w = firstWin(); return w && w.querySelector(".win-share"); } },
  { text:"You can open as many boxes as you like and set them side by side. Tap End when you are done.", target:function(){ return document.getElementById("spots"); } }
];
var at = -1, ringed = null;
function firstWin(){ var k = Object.keys(open); return k.length ? open[k[0]] : null; }
function showStep(i){
  if(ringed){ ringed.classList.remove("ring-on"); ringed = null; }
  if(i < 0 || i >= STEPS.length){ document.getElementById("coach").classList.remove("show"); at = -1; return; }
  at = i; var st = STEPS[i];
  if(st.before) st.before();
  document.getElementById("coachStep").textContent = "Step " + (i + 1) + " of " + STEPS.length;
  document.getElementById("coachText").textContent = st.text;
  document.getElementById("coachBack").style.visibility = i ? "visible" : "hidden";
  document.getElementById("coachNext").textContent = i === STEPS.length - 1 ? "Done" : "Next";
  document.getElementById("coach").classList.add("show");
  var el = st.target && st.target();
  if(el){ el.classList.add("ring-on"); ringed = el; if(el.scrollIntoView && !el.classList.contains("win-bar") && el.className.indexOf("win") < 0) el.scrollIntoView({ block:"nearest", behavior:"smooth" }); }
}
document.getElementById("tourBtn").addEventListener("click", function(){ showStep(0); });
document.getElementById("coachNext").addEventListener("click", function(){ showStep(at + 1); });
document.getElementById("coachBack").addEventListener("click", function(){ showStep(at - 1); });
document.getElementById("coachEnd").addEventListener("click", function(){ showStep(-1); });
document.addEventListener("keydown", function(e){ if(e.key === "Escape" && at >= 0) showStep(-1); });
</script>
<script src="../portal.js"></script>
</body>
</html>
